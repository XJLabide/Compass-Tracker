<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0a0b">
    <title>Compass · Offline</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0a0a0b; color: #ecedef; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 360px); border: 1px solid #292a2d; border-radius: 20px; background: #0f0f10; padding: 28px; }
      img { width: 44px; height: 44px; }
      h1 { margin: 20px 0 8px; font-size: 26px; letter-spacing: -.03em; }
      p { color: #a1a1aa; margin: 0 0 20px; }
      button { width: 100%; min-height: 48px; border: 0; border-radius: 13px; background: #65d0ea; color: #071014; font: inherit; font-weight: 650; cursor: pointer; }
      button:focus-visible { outline: 3px solid #f5d565; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/compass.svg" alt="">
      <h1>You’re offline</h1>
      <p>Your saved Compass changes stay on this device. Reconnect to open your workspace and sync them safely.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
